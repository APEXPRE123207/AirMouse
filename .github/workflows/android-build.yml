name: Android Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Buildozer (Docker)
        uses: addnab/docker-run-action@v3
        with:
          image: kivy/buildozer:latest
          options: -w /github/workspace/Android
          run: |
            set -eux
            # print python version and workspace for debugging
            python --version || true
            ls -la
            cat > buildozer.spec <<'EOF'
            [app]

            # App identity
            title           = AirMouse
            package.name    = airmouse
            package.domain  = com.airmouse

            # Source
            source.dir      = src
            source.include_exts = py,png,jpg,kv,atlas,json

            # Version
            version         = 0.1.0

            # Python / Kivy requirements
            requirements = python3,kivy==2.3.0,pyjnius,android

            # Android-specific
            android.permissions = BODY_SENSORS, INTERNET, ACCESS_NETWORK_STATE
            android.api         = 34
            android.minapi      = 24
            android.ndk         = 25b
            android.sdk         = 34
            android.archs       = arm64-v8a, armeabi-v7a

            # Sensor feature declaration (needed for Google Play)
            android.manifest.sensors = android.hardware.sensor.gyroscope

            # Orientation lock
            orientation = portrait

            # Icons (placeholder — replace before release)
            # icon.filename = %(source.dir)s/icon.png

            # Buildozer / p4a internals
            log_level   = 2
            warn_on_root = 1

            [buildozer]
            log_level = 2
            warn_on_root = 0
            EOF
            # Install/ensure buildozer is available
            pip install --upgrade pip
            pip install buildozer
            # Build the debug APK (adjust target if needed)
            python - <<'PY'
            import os
            from buildozer import Buildozer

            print('cwd=', os.getcwd())
            b = Buildozer(filename='/github/workspace/Android/buildozer.spec')
            b.check_root = lambda: None
            b.run_command(['android', 'debug'])
            PY

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: Android/bin/*.apk
