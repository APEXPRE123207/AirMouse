name: Android Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build APK with Buildozer
        uses: addnab/docker-run-action@v3
        with:
          image: kivy/buildozer:latest
          options: >-
            -v ${{ github.workspace }}:/github/workspace
            -w /github/workspace/Android
          run: |
            set -eux

            # ── Debug info ──
            python3 --version || true
            pwd
            ls -la

            # ── The buildozer.spec already lives in the repo.
            #    Patch warn_on_root so Buildozer won't prompt in CI.
            if grep -qE '^warn_on_root[[:space:]]*=' buildozer.spec; then
              sed -i -E 's/^warn_on_root[[:space:]]*=.*/warn_on_root = 0/' buildozer.spec
            else
              printf '\nwarn_on_root = 0\n' >> buildozer.spec
            fi

            # ── Accept Android SDK licenses non-interactively ──
            export BUILDOZER_WARN_ON_ROOT=0

            # ── Let Buildozer handle SDK/NDK download & build ──
            #    This is all you need — Buildozer automatically downloads
            #    the Android SDK, NDK, platform-tools, and build-tools.
            yes | buildozer android debug 2>&1

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: |
            Android/bin/*.apk
            Android/bin/*/*.apk
