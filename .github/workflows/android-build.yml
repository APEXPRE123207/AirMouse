name: Android Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Cache: store the .buildozer folder INSIDE the workspace.
      # The Docker container writes to /github/workspace/Android/.buildozer
      # (same path as the working dir), not to ~/.buildozer on the runner.
      # Caching the workspace-relative folder is what actually gets reused.
      - name: Cache Buildozer directory
        uses: actions/cache@v4
        with:
          path: Android/.buildozer
          key: buildozer-${{ hashFiles('Android/buildozer.spec') }}-v1
          restore-keys: |
            buildozer-

      - name: Build APK with Buildozer
        uses: addnab/docker-run-action@v3
        with:
          image: kivy/buildozer:latest
          options: >-
            -v ${{ github.workspace }}:/github/workspace
            -v ${{ env.HOME }}/.buildozer:/root/.buildozer
            -w /github/workspace/Android
          run: |
            set -eux

            python3 --version
            buildozer --version
            pwd && ls -la

            export BUILDOZER_WARN_ON_ROOT=0
            export GRADLE_OPTS="-Dorg.gradle.daemon=false"

            # ── Accept SDK licenses ───────────────────────────────────────
            # Phase 1: dry run to download SDK/cmdline-tools
            buildozer android debug 2>&1 || true

            # Phase 2: write license hash files directly so sdkmanager
            # never prompts again, even on clean cache restores
            SDK_LICENSES=/root/.buildozer/android/platform/android-sdk/licenses
            mkdir -p "$SDK_LICENSES"
            printf '8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n' \
              > "$SDK_LICENSES/android-sdk-license"
            printf '84831b9409646a918e30573bab4c9c91346d8abd\n' \
              > "$SDK_LICENSES/android-sdk-preview-license"
            printf '601085b94cd77f0b54ff86406957099ebe79c4d6\n' \
              > "$SDK_LICENSES/android-googletv-license"
            printf '33b6a2b64607f11b759f320ef9dff4ae5c47d97a\n' \
              > "$SDK_LICENSES/google-gdk-license"
            printf 'd975f751698a77b662f1254ddbeed3901e976f5a\n' \
              > "$SDK_LICENSES/intel-android-extra-license"

            SDKMANAGER=$(find /root/.buildozer/android/platform/android-sdk/cmdline-tools \
                              -name sdkmanager -type f 2>/dev/null | head -1 || true)
            if [ -n "$SDKMANAGER" ]; then
              yes | "$SDKMANAGER" --licenses 2>/dev/null || true
              yes | "$SDKMANAGER" "build-tools;37.0.0" 2>/dev/null || true
            fi

            # ── Phase 3: real build ───────────────────────────────────────
            buildozer android debug 2>&1

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: airmouse-debug-apk
          path: |
            Android/bin/*.apk
            Android/bin/*/*.apk
          if-no-files-found: error